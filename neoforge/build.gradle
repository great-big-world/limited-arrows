plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

version = "$project.mod_version+$project.minecraft_version"

base {
    // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
    archivesName = "$project.archives_name-$project.name"
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(':limited-arrows:common')) { transitive false }
    shadowBundle(project(path: ':limited-arrows:common', configuration: 'transformProductionFabric')) { transitive false }

    constraints {
        implementation("io.github.llamalad7:mixinextras-neoforge:$rootProject.mixinextras_version")
    }

    api("me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
}
